# GitHub Actions release workflow.
#
# Job split (kept this way deliberately):
#   - windows      : .exe + .msi  (only place these CAN be built — NSIS
#                                    + WiX are Windows-only binaries)
#   - macos-arm    : arm64 .dmg   (macos-15 hosted runner, M-series)
#   - linux .deb   : NOT here    — Bitbucket's `linux-release` step
#                                    already produces and uploads it;
#                                    duplicating on GHA wastes private-
#                                    repo minutes for zero benefit.
#
# Restored (2026-05-13): `macos-intel` job.
#   - The old macos-15-intel hosted runner had a persistent DiskArbitration
#     deadlock (root cause: macOS background services — XProtect,
#     Spotlight/mds — holding disk resources while hdiutil is mid-flight;
#     GitHub closed actions/runner-images#7522 in 2026-01 as
#     "working as designed"). We now cross-compile from the M-series
#     macos-15 runner instead: Rust cross-compiles natively, PyInstaller
#     runs under `arch -x86_64` (Rosetta 2), and create-dmg runs on ARM
#     with no hdiutil deadlocks.
#   - Belt-and-braces: release.sh's build_dmg() also uses create-dmg
#     v1.2.3's built-in `--hdiutil-retries 5` flag (PR#198, Nov 2025),
#     which retries hdiutil's create AND detach phases internally with
#     proper `sync` between attempts. Both job install steps version-
#     check create-dmg >= 1.2.3 so a Homebrew regression can't silently
#     re-introduce the hour-long hang.
#
# Why this exists alongside desktop/scripts/release.sh:
#   - release.sh builds macOS + Linux locally on a dev's laptop. Windows
#     builds need a real Windows host. GHA's hosted Mac/Windows runners
#     remove the Windows requirement and add reproducible Mac builds.
#   - GitHub-hosted runners are the cheapest way to get all three OSes
#     without owning Mac mini + Windows hardware. Mac jobs are 10× the
#     billed minutes of Linux on private repos, but our release cadence
#     keeps us well under the 2,000 min/mo free-plan quota.
#
# Triggers:
#   - Tag push matching v*.*.*       → builds + uploads every artefact
#   - Manual dispatch                 → builds + uploads (op picks tag)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   Build-time (always required):
#     CLERK_PUBLISHABLE_KEY_PROD      pk_live_… (read by build.rs)
#     CLERK_SECRET_KEY_PROD           sk_live_… (read by build.rs)
#
#   Cloud upload (optional — without these the artefacts are still
#                 uploaded as workflow artefacts, but NOT pushed to
#                 https://digi-setu.com/downloads/. You can manually
#                 download + upload via deploy/scripts/upload-installer.sh
#                 from your laptop):
#     GCP_SA_KEY                      JSON service-account key with
#                                     roles/iap.tunnelResourceAccessor +
#                                     roles/compute.osLogin so
#                                     `gcloud compute scp` succeeds
#     GCP_PROJECT                     digi-setu-dev   (default)
#     GCP_VM                          digi-setu-live  (default)
#     GCP_ZONE                        us-central1-a   (default)
#
#   Windows code-signing (optional — without these the .exe / .msi
#                         ship UNSIGNED and SmartScreen will warn on
#                         first launch; perfect for early access):
#     TRUSTED_SIGNING_ENDPOINT        e.g. https://eus.codesigning.azure.net
#     TRUSTED_SIGNING_ACCOUNT         your TS account name
#     TRUSTED_SIGNING_PROFILE         your TS certificate-profile name
#     AZURE_CLIENT_ID/CLIENT_SECRET   service principal with the
#     AZURE_TENANT_ID                 "Trusted Signing Certificate Profile
#                                     Signer" role on the cert profile

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  APP_VERSION: 0.1.0   # Keep in sync with tauri.conf.json + Download.vue

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions doesn't allow `secrets.X` inside `step.if` conditions.
      # Instead we surface the booleans as step outputs first, then gate
      # subsequent steps on `steps.flags.outputs.has_*`.
      - id: flags
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
        run: |
          [[ -n "$GCP_SA_KEY"  ]] && echo "has_gcp=true" >> "$GITHUB_OUTPUT" || echo "has_gcp=false" >> "$GITHUB_OUTPUT"
          [[ -n "$TS_ENDPOINT" ]] && echo "has_ts=true"  >> "$GITHUB_OUTPUT" || echo "has_ts=false"  >> "$GITHUB_OUTPUT"

      - name: Set up Rust (stable + windows-msvc target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Authenticate to Google Cloud (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Trusted Signing Dlib (optional)
        if: steps.flags.outputs.has_ts == 'true'
        shell: pwsh
        run: |
          # Microsoft renamed the package from Microsoft.Trusted.Signing.*
          # to Microsoft.ArtifactSigning.Client in late 2025. It's a
          # plain NuGet *library* (not a dotnet tool), so we pull the
          # nupkg straight from the v3 flat-container, unzip it, and
          # point signtool /dlib at bin/x64/Azure.CodeSigning.Dlib.dll.
          $pkgId = "microsoft.artifactsigning.client"
          $idx = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$pkgId/index.json"
          $version = $idx.versions[-1]
          $url = "https://api.nuget.org/v3-flatcontainer/$pkgId/$version/$pkgId.$version.nupkg"
          Write-Host "Pulling $pkgId $version from $url"
          New-Item -ItemType Directory -Force -Path .dlib | Out-Null
          Invoke-WebRequest -Uri $url -OutFile .dlib/pkg.nupkg
          Expand-Archive -LiteralPath .dlib/pkg.nupkg -DestinationPath .dlib -Force
          $dll = (Get-ChildItem -Recurse -Filter Azure.CodeSigning.Dlib.dll .dlib | Select-Object -First 1).FullName
          if (-not $dll) { throw "Azure.CodeSigning.Dlib.dll not found in $pkgId nupkg" }
          Write-Host "TRUSTED_SIGNING_DLIB_PATH=$dll"
          "TRUSTED_SIGNING_DLIB_PATH=$dll" >> $env:GITHUB_ENV

      - name: Stage build env (Clerk keys come straight from GHA secrets)
        shell: bash
        env:
          CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
          CLERK_SECRET_KEY_PROD: ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          # build.rs reads CLERK_*_PROD + the cloud-target URLs at compile
          # time. We feed them via a .env file (same shape release.sh writes)
          # so the Tauri build behaves identically on the runner and on a
          # dev's laptop. The cloud-target URLs are public; no need to
          # surface them as separate GHA secrets.
          {
            echo "CLERK_PUBLISHABLE_KEY_PROD=$CLERK_PUBLISHABLE_KEY_PROD"
            echo "CLERK_SECRET_KEY_PROD=$CLERK_SECRET_KEY_PROD"
            echo "PI_CLOUD_API_BASE=https://digi-setu.com"
            echo "PI_RELAY_BASE=https://api.digi-setu.com"
            echo "CLERK_TENANT=prod"
          } > .release-secrets.tmp.env
          chmod 0600 .release-secrets.tmp.env

      - name: Build Windows installers
        shell: pwsh
        env:
          TAURI_BUILD_ENV: ${{ github.workspace }}/.release-secrets.tmp.env
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT:  ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE:  ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
        run: |
          .\desktop\scripts\build-windows.ps1 -AppVersion $env:APP_VERSION -SkipGsm

      - name: Upload to digi-setu.com via gcloud SCP (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        shell: bash
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'digi-setu-dev' }}
          GCP_VM:      ${{ secrets.GCP_VM      || 'digi-setu-live' }}
          GCP_ZONE:    ${{ secrets.GCP_ZONE    || 'us-central1-a' }}
        run: |
          for f in "$RUNNER_TEMP/Digi-Setu-${APP_VERSION}-x64-setup.exe" "$RUNNER_TEMP/Digi-Setu-${APP_VERSION}-x64.msi"; do
            if [[ -f "$f" ]]; then
              bash deploy/scripts/upload-installer.sh "$f"
            else
              echo "::warning::missing artefact: $f"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  # NOTE — Linux .deb builds are NOT done here.
  # Bitbucket Pipelines (`linux-release` step in bitbucket-pipelines.yml)
  # already builds + uploads the .deb on every main + tag push. Doing it
  # twice would double our private-repo GHA minute spend for zero benefit.
  # If you ever migrate Linux off Bitbucket, restore the previous `linux:`
  # job from git history.

  # ── macOS arm64 (Apple Silicon) ─────────────────────────────────────
  # Output: Digi-Setu-<version>-arm64.dmg
  # Runs on M-series GitHub-hosted Mac. Native PyInstaller + Tauri build,
  # ad-hoc codesign (no Apple Developer ID), DMG via create-dmg.
  macos-arm:
    runs-on: macos-15            # M-series; arm64 native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: flags
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          [[ -n "$GCP_SA_KEY" ]] && echo "has_gcp=true" >> "$GITHUB_OUTPUT" || echo "has_gcp=false" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-arm-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install create-dmg + Pillow
        run: |
          # We require create-dmg >= 1.2.3 for its --hdiutil-retries flag
          # (PR#198, Nov 2025) — release.sh's build_dmg() depends on it
          # to survive macOS DiskArbitration deadlocks. Homebrew on a
          # fresh GHA runner pulls latest, so this is a belt-and-braces
          # version check; if it ever serves an older version we want a
          # loud failure here rather than a silent hour-long DMG hang.
          brew install create-dmg
          cdmg_ver="$(create-dmg --version 2>/dev/null | awk '{print $2; exit}')"
          if [[ -z "$cdmg_ver" ]]; then
            echo "::error::create-dmg installed but reported no --version; likely too old"
            exit 1
          fi
          # bash 3.2 doesn't have native version-compare; do it via sort -V.
          oldest_ok="1.2.3"
          if [[ "$(printf '%s\n%s\n' "$oldest_ok" "$cdmg_ver" | sort -V | head -1)" != "$oldest_ok" ]]; then
            echo "::error::create-dmg $cdmg_ver < $oldest_ok (missing --hdiutil-retries support)"
            exit 1
          fi
          echo "create-dmg $cdmg_ver OK"
          python3 -m pip install --quiet Pillow

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage backend/.env so release.sh --local-env picks up Clerk + cloud-target keys
        shell: bash
        env:
          CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
          CLERK_SECRET_KEY_PROD:      ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          mkdir -p desktop/backend
          {
            echo "CLERK_PUBLISHABLE_KEY_PROD=$CLERK_PUBLISHABLE_KEY_PROD"
            echo "CLERK_SECRET_KEY_PROD=$CLERK_SECRET_KEY_PROD"
            echo "PI_CLOUD_API_BASE=https://digi-setu.com"
            echo "PI_RELAY_BASE=https://api.digi-setu.com"
            echo "CLERK_TENANT=prod"
          } > desktop/backend/.env
          chmod 0600 desktop/backend/.env

      - name: Build mac DMG (release.sh --mac --local-env --no-upload)
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          # --local-env  → release.sh reads desktop/backend/.env (we just staged it)
          # --no-upload  → CI controls the upload below; release.sh's smoke-test
          #                 needs gcloud + curl against the eventual public URL,
          #                 which is brittle to do mid-job.
          bash desktop/scripts/release.sh --mac --local-env --no-upload

      - name: Upload .dmg to digi-setu.com (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'digi-setu-dev' }}
          GCP_VM:      ${{ secrets.GCP_VM      || 'digi-setu-live' }}
          GCP_ZONE:    ${{ secrets.GCP_ZONE    || 'us-central1-a' }}
        run: |
          DMG="/tmp/Digi-Setu-${APP_VERSION}-arm64.dmg"
          if [[ -f "$DMG" ]]; then
            bash deploy/scripts/upload-installer.sh "$DMG"
          else
            echo "::warning::no arm64 .dmg produced at $DMG"
            ls -la /tmp/Digi-Setu-* || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: /tmp/Digi-Setu-*-arm64.dmg

  # ── macOS x86_64 (Intel) ────────────────────────────────────────────
  # Output: Digi-Setu-<version>-x86_64.dmg
  #
  # Runs on the SAME M-series runner as macos-arm, but cross-compiles
  # for x86_64 via Rosetta 2. This sidesteps the DiskArbitration
  # deadlock that plagued the now-removed macos-15-intel job entirely:
  #   - Rust cross-compiles natively (just `--target x86_64-apple-darwin`)
  #   - PyInstaller runs under `arch -x86_64` to produce an x86_64 sidecar
  #   - create-dmg runs on ARM (no hdiutil deadlocks on M-series)
  #
  # Depends on macos-arm so we don't double-bill on the frontend +
  # icon builds; the frontend dist is architecture-independent and
  # gets shared via upload-artifact / download-artifact.
  macos-intel:
    runs-on: macos-15            # M-series; cross-compiles via Rosetta
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: flags
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          [[ -n "$GCP_SA_KEY" ]] && echo "has_gcp=true" >> "$GITHUB_OUTPUT" || echo "has_gcp=false" >> "$GITHUB_OUTPUT"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-intel-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install create-dmg + Pillow
        run: |
          # Same version pin as macos-arm — release.sh's build_dmg()
          # depends on create-dmg >= 1.2.3's --hdiutil-retries flag.
          brew install create-dmg
          cdmg_ver="$(create-dmg --version 2>/dev/null | awk '{print $2; exit}')"
          if [[ -z "$cdmg_ver" ]]; then
            echo "::error::create-dmg installed but reported no --version; likely too old"
            exit 1
          fi
          oldest_ok="1.2.3"
          if [[ "$(printf '%s\n%s\n' "$oldest_ok" "$cdmg_ver" | sort -V | head -1)" != "$oldest_ok" ]]; then
            echo "::error::create-dmg $cdmg_ver < $oldest_ok (missing --hdiutil-retries support)"
            exit 1
          fi
          echo "create-dmg $cdmg_ver OK"
          python3 -m pip install --quiet Pillow

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage backend/.env with Clerk + cloud-target keys
        shell: bash
        env:
          CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
          CLERK_SECRET_KEY_PROD:      ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          mkdir -p desktop/backend
          {
            echo "CLERK_PUBLISHABLE_KEY_PROD=$CLERK_PUBLISHABLE_KEY_PROD"
            echo "CLERK_SECRET_KEY_PROD=$CLERK_SECRET_KEY_PROD"
            echo "PI_CLOUD_API_BASE=https://digi-setu.com"
            echo "PI_RELAY_BASE=https://api.digi-setu.com"
            echo "CLERK_TENANT=prod"
          } > desktop/backend/.env
          chmod 0600 desktop/backend/.env

      - name: Build x86_64 sidecar under Rosetta
        run: |
          cd desktop/backend
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --quiet --disable-pip-version-check -r requirements.txt
          pip install --quiet "pyinstaller>=6.10,<7"
          cd ../sidecar
          # Run PyInstaller under Rosetta so the frozen binary is x86_64
          arch -x86_64 python -m PyInstaller --clean --noconfirm pyinstaller.spec
          # Tauri expects the platform-suffixed name
          DIST="$(pwd)/dist"
          cp "$DIST/pi-typst-sidecar" "$DIST/pi-typst-sidecar-x86_64-apple-darwin"

      - name: Build x86_64 DMG (release.sh --mac --local-env --no-upload --skip-sidecar)
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          # Override the host arch detection so release.sh targets x86_64
          # even though we're running on ARM. The sidecar is already built
          # above (x86_64 via Rosetta), so --skip-sidecar avoids rebuilding
          # it as arm64.
          export TAURI_CLI_TARGET=x86_64-apple-darwin
          bash desktop/scripts/release.sh --mac --local-env --no-upload --skip-sidecar

      - name: Upload .dmg to digi-setu.com (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'digi-setu-dev' }}
          GCP_VM:      ${{ secrets.GCP_VM      || 'digi-setu-live' }}
          GCP_ZONE:    ${{ secrets.GCP_ZONE    || 'us-central1-a' }}
        run: |
          DMG="/tmp/Digi-Setu-${APP_VERSION}-x86_64.dmg"
          if [[ -f "$DMG" ]]; then
            bash deploy/scripts/upload-installer.sh "$DMG"
          else
            echo "::warning::no x86_64 .dmg produced at $DMG"
            ls -la /tmp/Digi-Setu-* || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: /tmp/Digi-Setu-*-x86_64.dmg
