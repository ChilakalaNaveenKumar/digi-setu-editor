# GitHub Actions release workflow.
#
# Why this exists alongside desktop/scripts/release.sh:
#   - release.sh builds macOS natively + Linux in a local Docker
#     container. Windows builds need a real Windows host (cargo can
#     cross-link to MSVC, but Tauri's NSIS + WiX bundlers are
#     Windows-only binaries).
#   - GitHub-hosted runners give us free Windows + Linux compute,
#     so we offload Windows builds here and leave macOS as the
#     dev's local artefact (Apple notarisation requires the dev's
#     own Developer ID anyway).
#
# Triggers:
#   - Tag push matching v*.*.*       → builds + uploads every artefact
#   - Manual dispatch                 → builds + uploads (op picks tag)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   Build-time (always required):
#     CLERK_PUBLISHABLE_KEY_PROD      pk_live_… (read by build.rs)
#     CLERK_SECRET_KEY_PROD           sk_live_… (read by build.rs)
#
#   Cloud upload (optional — without these the artefacts are still
#                 uploaded as workflow artefacts, but NOT pushed to
#                 https://digi-setu.com/downloads/. You can manually
#                 download + upload via deploy/scripts/upload-installer.sh
#                 from your laptop):
#     GCP_SA_KEY                      JSON service-account key with
#                                     roles/iap.tunnelResourceAccessor +
#                                     roles/compute.osLogin so
#                                     `gcloud compute scp` succeeds
#     GCP_PROJECT                     digi-setu-dev   (default)
#     GCP_VM                          digi-setu-live  (default)
#     GCP_ZONE                        us-central1-a   (default)
#
#   Windows code-signing (optional — without these the .exe / .msi
#                         ship UNSIGNED and SmartScreen will warn on
#                         first launch; perfect for early access):
#     TRUSTED_SIGNING_ENDPOINT        e.g. https://eus.codesigning.azure.net
#     TRUSTED_SIGNING_ACCOUNT         your TS account name
#     TRUSTED_SIGNING_PROFILE         your TS certificate-profile name
#     AZURE_CLIENT_ID/CLIENT_SECRET   service principal with the
#     AZURE_TENANT_ID                 "Trusted Signing Certificate Profile
#                                     Signer" role on the cert profile

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  APP_VERSION: 0.1.0   # Keep in sync with tauri.conf.json + Download.vue

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions doesn't allow `secrets.X` inside `step.if` conditions.
      # Instead we surface the booleans as step outputs first, then gate
      # subsequent steps on `steps.flags.outputs.has_*`.
      - id: flags
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
        run: |
          [[ -n "$GCP_SA_KEY"  ]] && echo "has_gcp=true" >> "$GITHUB_OUTPUT" || echo "has_gcp=false" >> "$GITHUB_OUTPUT"
          [[ -n "$TS_ENDPOINT" ]] && echo "has_ts=true"  >> "$GITHUB_OUTPUT" || echo "has_ts=false"  >> "$GITHUB_OUTPUT"

      - name: Set up Rust (stable + windows-msvc target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Authenticate to Google Cloud (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Trusted Signing Dlib (optional)
        if: steps.flags.outputs.has_ts == 'true'
        shell: pwsh
        run: |
          # The Dlib ships as a NuGet package. Pull it once into a
          # workspace-local folder so signtool /dlib points at a stable
          # path that survives the rest of the job. We install via
          # dotnet so we don't need an Azure CLI dependency at runtime.
          dotnet tool install --tool-path .dlib `
            Microsoft.Trusted.Signing.Client.PSCmdlets
          # Resolve the assembly path; the actual DLL location varies
          # slightly between versions of the cmdlets package.
          $dll = (Get-ChildItem -Recurse -Filter Azure.CodeSigning.Dlib.dll .dlib | Select-Object -First 1).FullName
          if (-not $dll) { throw "Trusted Signing Dlib install did not produce the expected dll" }
          "TRUSTED_SIGNING_DLIB_PATH=$dll" >> $env:GITHUB_ENV

      - name: Stage build env (Clerk keys come straight from GHA secrets)
        shell: bash
        env:
          CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
          CLERK_SECRET_KEY_PROD: ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          # build.rs reads CLERK_*_PROD + the cloud-target URLs at compile
          # time. We feed them via a .env file (same shape release.sh writes)
          # so the Tauri build behaves identically on the runner and on a
          # dev's laptop. The cloud-target URLs are public; no need to
          # surface them as separate GHA secrets.
          {
            echo "CLERK_PUBLISHABLE_KEY_PROD=$CLERK_PUBLISHABLE_KEY_PROD"
            echo "CLERK_SECRET_KEY_PROD=$CLERK_SECRET_KEY_PROD"
            echo "PI_CLOUD_API_BASE=https://digi-setu.com"
            echo "PI_RELAY_BASE=https://api.digi-setu.com"
            echo "CLERK_TENANT=prod"
          } > .release-secrets.tmp.env
          chmod 0600 .release-secrets.tmp.env

      - name: Build Windows installers
        shell: pwsh
        env:
          TAURI_BUILD_ENV: ${{ github.workspace }}/.release-secrets.tmp.env
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT:  ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE:  ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
        run: |
          .\desktop\scripts\build-windows.ps1 -AppVersion $env:APP_VERSION -SkipGsm

      - name: Upload to digi-setu.com via gcloud SCP (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        shell: bash
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'digi-setu-dev' }}
          GCP_VM:      ${{ secrets.GCP_VM      || 'digi-setu-live' }}
          GCP_ZONE:    ${{ secrets.GCP_ZONE    || 'us-central1-a' }}
        run: |
          for f in "$RUNNER_TEMP/Digi-Setu-${APP_VERSION}-x64-setup.exe" "$RUNNER_TEMP/Digi-Setu-${APP_VERSION}-x64.msi"; do
            if [[ -f "$f" ]]; then
              bash deploy/scripts/upload-installer.sh "$f"
            else
              echo "::warning::missing artefact: $f"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  linux:
    # Optional: redundant with the local Docker build (release.sh --linux),
    # but mirrors Windows's flow for the day we add tagged release automation.
    # Comment this job out if you only want Windows-on-CI.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: flags
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          [[ -n "$GCP_SA_KEY" ]] && echo "has_gcp=true" >> "$GITHUB_OUTPUT" || echo "has_gcp=false" >> "$GITHUB_OUTPUT"

      - name: Install Tauri 2 system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev xdg-utils \
            libssl-dev libffi-dev fakeroot dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-linux-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.flags.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage build env (Clerk keys come straight from GHA secrets)
        shell: bash
        env:
          CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
          CLERK_SECRET_KEY_PROD: ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          {
            echo "CLERK_PUBLISHABLE_KEY_PROD=$CLERK_PUBLISHABLE_KEY_PROD"
            echo "CLERK_SECRET_KEY_PROD=$CLERK_SECRET_KEY_PROD"
            echo "PI_CLOUD_API_BASE=https://digi-setu.com"
            echo "PI_RELAY_BASE=https://api.digi-setu.com"
            echo "CLERK_TENANT=prod"
          } > .release-secrets.tmp.env

      - name: Build (PyInstaller sidecar + frontend + Tauri Linux bundle)
        env:
          TAURI_BUILD_ENV: ${{ github.workspace }}/.release-secrets.tmp.env
        run: |
          # Reuse the same in-container script we use locally — runners
          # have all the prereqs the Dockerfile installs, so we skip
          # the Docker layer and execute the steps directly.
          bash desktop/scripts/build-linux-inside.sh

      - name: Upload artefacts to digi-setu.com (only if SA key provided)
        if: steps.flags.outputs.has_gcp == 'true'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'digi-setu-dev' }}
          GCP_VM:      ${{ secrets.GCP_VM      || 'digi-setu-live' }}
          GCP_ZONE:    ${{ secrets.GCP_ZONE    || 'us-central1-a' }}
        run: |
          for f in /tmp/Digi-Setu-${APP_VERSION}-amd64.deb /tmp/Digi-Setu-${APP_VERSION}-amd64.AppImage; do
            [[ -f "$f" ]] && bash deploy/scripts/upload-installer.sh "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            /tmp/Digi-Setu-*-amd64.deb
            /tmp/Digi-Setu-*-amd64.AppImage
