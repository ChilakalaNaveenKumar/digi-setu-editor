[package]
name = "digi-setu-desktop"
version = "0.1.0"
description = "Digi Setu desktop shell — Tauri wrapper around desktop/backend + desktop/frontend (forked from web/* and now diverging freely)"
authors = ["Digi Setu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "digi_setu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "digi-setu-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Single-instance enforcement: a second `Digi Setu` launch (e.g. dock
# double-click while the app is already open) calls back into the
# already-running process so we can focus the existing window instead
# of spawning a second sidecar that fights for the same registry file.
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"
tempfile = "3"
thiserror = "2"

# Free-port discovery: we ask the OS for an available TCP port before
# spawning the sidecar so two desktop instances don't fight over 8788.
portpicker = "0.1"

# Persistent SSO: store the Clerk session id in the OS keychain so the
# user stays signed in across app restarts (Cursor-style — sign in
# once, stay signed in for weeks). On macOS this maps to Keychain
# Services, on Windows to Credential Vault, on Linux to libsecret.
# We never store JWTs here (those are short-lived and re-minted on
# demand from the cached session id), only the long-lived id itself.
keyring = "3"

# `dirs` resolves the platform-correct home directory on every OS
# without us shelling out to `getent passwd` or pulling in libc. Used
# by secure_storage.rs's file-fallback for the Clerk session id; we
# need the home dir at the same place commands.rs::app_data_dir
# resolves it to so the file-fallback shares ~/.digi-setu with the
# rest of the desktop's user data.
dirs = "5"

[features]
# Tauri's default features pull in `custom-protocol` which we want for prod
# (so the bundled SPA loads via tauri://localhost). In dev `tauri dev` flips
# this off automatically and points at the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
