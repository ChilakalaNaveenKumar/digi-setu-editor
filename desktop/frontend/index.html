<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digi Setu</title>

    <!--
      Cache-busting: hashed JS/CSS chunks already cache forever via
      Vite's content hashes. The entry HTML is what bites users when
      they end up on a stale shell that points at deleted bundles.
      no-cache here forces a revalidation on every load while leaving
      asset caching untouched.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicons. Multi-resolution ICO is the universally supported
         entry; the explicit 32 / 192 PNG hints help modern browsers
         pick a sharp asset without parsing the ICO container; the
         apple-touch-icon is what iOS uses for home-screen pins.
         Every asset is rendered from the actual Digi Setu wordmark
         (white-logo.svg) over a slate-900 rounded chip, so the brand
         reads identically everywhere. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Brand metadata for browsers / OS / PWA installs -->
    <meta name="application-name" content="Digi Setu" />
    <meta name="apple-mobile-web-app-title" content="Digi Setu" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Digi Setu — an AI agent that turns your prompts into production-quality Typst documents and code, in a sandboxed workspace."
    />

    <!-- Open Graph + Twitter card for shares.
         The full wordmark logo doubles as the share image — it's a
         pure-monogram raster pattern under the hood so it scales
         cleanly to the 1200×630 OG slot most platforms render at. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digi Setu" />
    <meta property="og:title" content="Digi Setu" />
    <meta
      property="og:description"
      content="An AI agent that turns your prompts into production-quality Typst documents and code, in a sandboxed workspace."
    />
    <!-- OG image is the rasterized PNG; most social cards reject SVG. -->
    <meta property="og:image" content="/digi-setu-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1269" />
    <meta property="og:image:height" content="866" />
    <meta property="og:image:alt" content="Digi Setu wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digi Setu" />
    <meta
      name="twitter:description"
      content="An AI agent that turns your prompts into production-quality Typst documents and code, in a sandboxed workspace."
    />
    <meta name="twitter:image" content="/digi-setu-logo.png" />
  </head>
  <body class="bg-page text-zinc-200 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
