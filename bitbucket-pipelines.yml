# Bitbucket Pipelines — single source of truth for ALL deployments.
#
# What runs on every push to `main`:
#   1. Cloud backend (parallel) — Cloud Build the pi-backend +
#      pi-session images, push to Artifact Registry, ssh into the VM
#      and roll docker-compose. Same as `bash deploy/scripts/remote-deploy.sh backend`
#      from a laptop.
#   2. Web frontend (parallel) — build the Vue SPA in a deterministic
#      Node container, stream `dist/` to /srv/pi/www on the VM. Same
#      as `bash deploy/scripts/remote-deploy.sh frontend`.
#   3. Linux .deb (parallel) — full Tauri release build inside an
#      ubuntu:22.04 step, upload to digi-setu.com/downloads/.
#   4. Mirror to GitHub (sequential, last) — push the same commit
#      and any new tags to the GitHub mirror. Pushing a tag fires
#      .github/workflows/release.yml which builds Windows .exe / .msi
#      on a windows-latest runner (Bitbucket has no Windows agents).
#
# What runs on every PR (or non-main branch push):
#   - Web + desktop frontend typecheck + build (lints, vite build)
#   - Backend pytest smoke
#
# What runs on `v*.*.*` tag push:
#   - Same as main, plus the tag is mirrored to GitHub which triggers
#     the GHA Windows + Linux release jobs (those upload .exe / .msi /
#     .deb / .AppImage to digi-setu.com/downloads/).
#
# Why GitHub for Windows + macOS: Bitbucket Cloud has no Windows or
# macOS hosted runners — only Linux. We mirror tags to GitHub so
# .github/workflows/release.yml can produce:
#   - Windows .exe + .msi   (windows-latest runner, signed via
#                            Azure Trusted Signing when configured)
#   - macOS arm64 .dmg      (macos-15 runner, native M-series build)
#   - macOS Intel .dmg      (macos-15-intel runner, native x86_64;
#                            available until Aug 2027 per GitHub's
#                            Intel runner roadmap)
# Linux .deb stays here on Bitbucket so we don't double our private-
# repo GHA minute spend. AppImage is held back (FUSE not available
# on cloud Bitbucket runners; needs a self-hosted runner with
# /dev/fuse to land).
#
# Required pipeline variables (Repository settings → Pipelines → Variables):
#
#   ── always required ─────────────────────────────────────────────
#   GCP_SA_KEY_B64        base64-encoded JSON service-account key with:
#                           - roles/cloudbuild.builds.builder
#                           - roles/serviceusage.serviceUsageConsumer
#                           - roles/storage.objectAdmin
#                           - roles/logging.logWriter
#                           - roles/artifactregistry.writer
#                           - roles/secretmanager.secretAccessor
#                           - roles/iap.tunnelResourceAccessor
#                           - roles/compute.osAdminLogin   (sudo via OS Login)
#                           - roles/iam.serviceAccountUser
#                         (run `deploy/scripts/secrets-sync.sh seed-ci-sa`
#                          once to provision an SA with this exact set
#                          and emit a base64 key on stdout — paste below)
#   GCP_PROJECT           digi-setu-dev
#   GCP_VM                digi-setu-live
#   GCP_ZONE              us-central1-a
#
#   ── for the GitHub-mirror step ──────────────────────────────────
#   GH_MIRROR_TOKEN       GitHub PAT with Contents + Workflows + Secrets
#                         (Read+Write) on nchilaka-create/DIGI-SETU
#   GH_MIRROR_REPO        nchilaka-create/DIGI-SETU
#                         (override only if you fork / rename)

image: ubuntu:22.04

definitions:
  caches:
    cargo-registry: ~/.cargo/registry
    cargo-git: ~/.cargo/git
    cargo-target: desktop/src-tauri/target/x86_64-unknown-linux-gnu
    # Caches the rustup toolchain (~150 MB: stdlib + linker + std for the
    # x86_64-unknown-linux-gnu target). Without this, every linux-release
    # spends ~60 s redownloading the toolchain.
    rustup-toolchain: ~/.rustup
    # Caches the gcloud SDK install dir (~80 MB) so subsequent runs skip
    # the curl|bash bootstrap that adds ~30 s to every step.
    gcloud-sdk: /opt/google-cloud-sdk
    # Caches the apt package archive (~250 MB across all the GTK/Tauri
    # build deps). With it, apt-get install is a 5-second metadata refresh
    # instead of a 60-second download.
    apt-archive: /var/cache/apt/archives

  services:
    # Bumped from the default 1 GB so the docker container that runs
    # `vite build` has enough headroom (peak ~2.5 GB on our SPA). Only
    # safe on 2x+ steps; on 1x this trips the validator because the
    # parent step needs >=1 GB for its own scripts.
    docker:
      memory: 4096

  steps:
    # ── Common bootstrap shared by every step that talks to GCP ────
    # Activates the SA, points gcloud at the right project, makes
    # `gcloud compute scp` work non-interactively over IAP.
    - step: &activate-gcp
        name: (template — never invoked alone)
        script:
          - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates python3 gnupg
          - curl -fsSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt
          - export PATH="/opt/google-cloud-sdk/bin:$PATH"
          - echo "$GCP_SA_KEY_B64" | base64 -d > /tmp/sa.json
          - gcloud auth activate-service-account --key-file=/tmp/sa.json
          - gcloud config set project "$GCP_PROJECT"

    # ── 1. Cloud backend: Cloud Build the image, roll the VM ───────
    - step: &cloud-backend
        name: Cloud backend (rebuild image + roll VM)
        image: google/cloud-sdk:slim
        script:
          - apt-get update -qq && apt-get install -y --no-install-recommends git
          - echo "$GCP_SA_KEY_B64" | base64 -d > /tmp/sa.json
          - gcloud auth activate-service-account --key-file=/tmp/sa.json
          - gcloud config set project "$GCP_PROJECT"
          # remote-deploy.sh does build_backend (Cloud Build) + roll_stack
          # (ssh into VM, swap image tag, restart pi.service). Both rely
          # on the SA having the IAM roles listed in the file header.
          - bash deploy/scripts/remote-deploy.sh backend

    # ── 2. Web frontend: build SPA in container, stream to /srv/pi/www
    - step: &web-frontend
        name: Web frontend (rebuild SPA + deploy to /srv/pi/www)
        image: google/cloud-sdk:slim
        # Vite's "rendering chunks" pass on our 821-module SPA peaks
        # at ~2.5 GB. With a 1x runner (4 GB total) and the default
        # 1 GB docker service, npm build inside docker gets OOM'd
        # (exit 137). 2x = 8 GB total → docker can have 4 GB and the
        # step script still keeps 4 GB for itself.
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq && apt-get install -y --no-install-recommends git docker.io
          - echo "$GCP_SA_KEY_B64" | base64 -d > /tmp/sa.json
          - gcloud auth activate-service-account --key-file=/tmp/sa.json
          - gcloud config set project "$GCP_PROJECT"
          # `remote-deploy.sh frontend` builds via deploy/Dockerfile.frontend
          # then `docker run --rm | gcloud compute ssh tar -x` into /srv/pi/www.
          # Caddy serves the resulting dist as a read-only mount, so the new
          # bundle is live the moment tar finishes.
          - bash deploy/scripts/remote-deploy.sh frontend

    # ── 3. Linux .deb release (Tauri bundle + upload) ──────────────
    - step: &linux-release
        name: Linux .deb release build + upload
        image: ubuntu:22.04
        size: 2x        # Tauri's Rust release link is RAM-hungry
        caches:
          - cargo-registry
          - cargo-git
          - cargo-target
          - rustup-toolchain
          - gcloud-sdk
          - apt-archive
          - node
        script:
          # tzdata + a few other apt packages (libssl, dpkg-dev) try to
          # ask debconf questions ("which timezone?") on a fresh
          # ubuntu:22.04 image. Bitbucket runners have no TTY → the
          # readline frontend deadlocks and the step eventually times
          # out after 60 min. Pre-seeding both vars makes every
          # apt-get install below fully unattended.
          - export DEBIAN_FRONTEND=noninteractive
          - export TZ=Etc/UTC
          - ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          # Keep the apt archive cache populated across runs: turn off
          # the auto-clean hook that defaults to nuking /var/cache/apt
          # at the end of every transaction.
          - rm -f /etc/apt/apt.conf.d/docker-clean
          - echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/01keep-debs
          - apt-get update -qq
          - >
            apt-get install -y --no-install-recommends
            ca-certificates curl wget git file build-essential pkg-config
            libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev librsvg2-dev xdg-utils
            libssl-dev libffi-dev zlib1g-dev libsqlite3-dev libbz2-dev
            liblzma-dev libreadline-dev tk-dev libncurses-dev
            desktop-file-utils fakeroot dpkg-dev
            software-properties-common gnupg lsb-release python3
            openssh-client
          - add-apt-repository -y ppa:deadsnakes/ppa
          - apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-dev
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y --no-install-recommends nodejs
          # Reuse cached rustup if present (saves ~60s); otherwise install fresh.
          # If the cache contains a partial install (dir exists but binary
          # missing), wipe it first — the rustup-init script bails on a
          # non-empty CARGO_HOME just like gcloud does on a non-empty
          # install dir.
          - >
            if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              [ -d "$HOME/.cargo" ] && rm -rf "$HOME/.cargo" "$HOME/.rustup";
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable;
            fi
          - source $HOME/.cargo/env
          - rustup target add x86_64-unknown-linux-gnu
          # Reuse cached gcloud SDK if present (saves ~30s).
          # The Bitbucket cache restores /opt/google-cloud-sdk on every run.
          # If the previous run was killed mid-install (Bitbucket runner
          # cancellation or step timeout), the dir exists but bin/gcloud
          # doesn't — and Google's installer refuses to write to a non-empty
          # dir. So if the binary check fails, nuke the half-baked dir
          # before re-installing. Without this, the cache becomes a poison
          # pill that breaks every subsequent linux-release step.
          - >
            if [ ! -x "/opt/google-cloud-sdk/bin/gcloud" ]; then
              rm -rf /opt/google-cloud-sdk;
              curl -fsSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt;
            fi
          - export PATH="/opt/google-cloud-sdk/bin:$PATH"
          - echo "$GCP_SA_KEY_B64" | base64 -d > /tmp/sa.json
          - gcloud auth activate-service-account --key-file=/tmp/sa.json
          - gcloud config set project "$GCP_PROJECT"
          # Hydrate build.rs's compile-time env from GSM. Same shape
          # release.sh writes locally so build behaviour is identical.
          - >
            : > .release-secrets.tmp.env;
            for k in CLERK_PUBLISHABLE_KEY_PROD CLERK_SECRET_KEY_PROD; do
              v=$(gcloud secrets versions access latest --project "$GCP_PROJECT" --secret "$k" 2>/dev/null || true);
              [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> .release-secrets.tmp.env;
            done;
            { echo "PI_CLOUD_API_BASE=https://digi-setu.com"; echo "PI_RELAY_BASE=https://api.digi-setu.com"; echo "CLERK_TENANT=prod"; } >> .release-secrets.tmp.env
          - export TAURI_BUILD_ENV="$BITBUCKET_CLONE_DIR/.release-secrets.tmp.env"
          # build-linux-inside.sh defaults WORKSPACE=/workspace because
          # it normally runs inside our Docker linux-builder image with
          # the repo bind-mounted there. On a Bitbucket runner the
          # checkout lives at $BITBUCKET_CLONE_DIR instead, so point
          # the script at it explicitly.
          - export WORKSPACE="$BITBUCKET_CLONE_DIR"
          # AppImage stays disabled by default — Tauri downloads its own
          # linuxdeploy.AppImage which needs FUSE (not available in
          # cloud Bitbucket runners). Set LINUX_BUILD_APPIMAGE=1 in
          # repository variables once you have a self-hosted runner
          # with /dev/fuse.
          - export LINUX_BUILD_APPIMAGE="${LINUX_BUILD_APPIMAGE:-0}"
          - bash desktop/scripts/build-linux-inside.sh
          - >
            for f in desktop/build-out/linux/deb/*.deb desktop/build-out/linux/appimage/*.AppImage; do
              [ -f "$f" ] || continue;
              # Normalise filename (Tauri puts a space in it) before upload.
              base=$(basename "$f");
              norm="/tmp/${base// /-}";
              norm="${norm/Digi-Setu_/Digi-Setu-}";
              norm="${norm/_amd64/-amd64}";
              cp "$f" "$norm";
              GCP_PROJECT="$GCP_PROJECT" GCP_VM="$GCP_VM" GCP_ZONE="$GCP_ZONE" \
                bash deploy/scripts/upload-installer.sh "$norm";
            done
        artifacts:
          - "desktop/build-out/linux/**"
          - "/tmp/Digi-Setu-*-amd64.deb"
          - "/tmp/Digi-Setu-*-amd64.AppImage"

    # ── 4. Mirror to GitHub so GHA can build Windows ───────────────
    # Pushing the same commit + tags to nchilaka-create/DIGI-SETU
    # automatically triggers .github/workflows/release.yml on every
    # `v*.*.*` tag, which produces the Windows .exe / .msi (signed
    # via Azure Trusted Signing when secrets are configured).
    - step: &github-mirror
        name: Mirror commit + tags to GitHub (Windows CI fires from there)
        image: alpine:3.20
        script:
          - apk add --no-cache git
          - git config --global user.email "ci@digi-setu.com"
          - git config --global user.name "Bitbucket Pipelines"
          - git remote add github "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${GH_MIRROR_REPO:-nchilaka-create/DIGI-SETU}.git"
          # Bitbucket clones shallow by default; --no-shallow-since avoids
          # the "did not receive expected object" pack-negotiation error
          # that sinks fresh pushes to an empty / divergent target.
          - git fetch --unshallow origin "$BITBUCKET_BRANCH" || git fetch origin "$BITBUCKET_BRANCH"
          # Always push the branch. Push the tag too if this run was
          # triggered by a tag push.
          - git push --force-with-lease github "HEAD:${BITBUCKET_BRANCH:-main}"
          - >
            if [ -n "${BITBUCKET_TAG}" ]; then
              git push github "${BITBUCKET_TAG}";
              echo "[mirror] pushed tag ${BITBUCKET_TAG} → GHA windows job will fire";
            fi

    # ── PR / branch CI: cheap typecheck + smoke tests ──────────────
    - step: &web-typecheck
        name: Web frontend typecheck + build
        image: node:22
        caches:
          - node
        script:
          - cd web/frontend
          - npm ci --no-audit --no-fund
          - npm run typecheck || true
          - npm run build

    - step: &desktop-typecheck
        name: Desktop frontend typecheck + build
        image: node:22
        caches:
          - node
        script:
          - cd desktop/frontend
          - npm ci --no-audit --no-fund
          - npm run typecheck || true
          - npm run build

    - step: &backend-pytest
        name: Backend pytest smoke
        image: python:3.11-slim
        script:
          - apt-get update -qq && apt-get install -y --no-install-recommends build-essential
          - cd web/backend
          - pip install -q -r requirements.txt pytest
          - pytest -q tests/ || true

pipelines:
  # Pull-requests + non-main branches: cheap typecheck only.
  # Kept parallel because these are read-only, fast, and there's no
  # cross-step state to corrupt.
  pull-requests:
    "**":
      - parallel:
          - step: *web-typecheck
          - step: *desktop-typecheck
          - step: *backend-pytest

  # Push to main: redeploy EVERYTHING sequentially.
  #
  # Why sequential and not parallel:
  #   - Bitbucket charges per parallel runner-minute, so 4 steps in
  #     parallel cost 4x runner-minutes vs sequential. Sequential
  #     keeps us comfortably under the 3,500 min/mo plan even on
  #     heavy days.
  #   - Each runner is a fresh container; sequential lets one finish
  #     and free its memory before the next starts (matters for the
  #     2x web-frontend + 2x linux-release back-to-back).
  #   - A failure in cloud-backend means the API is broken; you
  #     probably don't want to also push a new SPA that talks to
  #     the broken API. Sequential gives natural fail-fast: any
  #     red step stops the chain.
  #   - The build log becomes linear and readable (no interleaved
  #     output across parallel runners).
  #
  # Order is cheapest → most expensive, so a config error is caught
  # in 30 s instead of 10 min:
  #   1. cloud-backend  (~3 min — Cloud Build runs remotely)
  #   2. web-frontend   (~5 min — Vite + tar over SSH)
  #   3. linux-release  (~12 min — full Tauri Rust release link)
  #   4. github-mirror  (~10 s — git push)
  branches:
    main:
      - step: *cloud-backend
      - step: *web-frontend
      - step: *linux-release
      - step: *github-mirror

  # Tag push: same chain as main. Pushing the tag in the mirror step
  # additionally fires .github/workflows/release.yml on a windows-latest
  # GHA runner which produces the .exe / .msi.
  tags:
    "v*":
      - step: *cloud-backend
      - step: *web-frontend
      - step: *linux-release
      - step: *github-mirror
